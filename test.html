<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест на знания</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fc; display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { background: #0d2b5c; }
        .nav-link { color: white !important; font-weight: 500; }
        .nav-link:hover, .nav-link.active { color: #00ffaa !important; }
        main { flex: 1; }
        footer { background: #0d2b5c; color: white; text-align: center; padding: 1rem; margin-top: 2rem; }
        .question-card { background: white; border-radius: 15px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 2rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🔒 Цифровой след</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="index.html">Главная</a>
            <a class="nav-link" href="kak-formiruetsya.html">Как формируется след</a>
            <a class="nav-link" href="ugrozy.html">Угрозы</a>
            <a class="nav-link" href="zashchita.html">Защита</a>
            <a class="nav-link" href="instrumenty.html">Инструменты</a>
            <a class="nav-link active" href="test.html">Тест</a>
        </div>
    </div>
</nav>

<main>
    <div class="container py-5">
        <h2 class="text-center mb-5">Тест на знания темы «Информационный след пользователя»</h2>
        <p class="text-center text-muted mb-4">Ответьте на 10 вопросов и проверьте, насколько хорошо вы знаете тему</p>

        <div class="question-card mx-auto" style="max-width: 800px;">
            <div class="d-flex justify-content-between mb-4">
                <span class="fs-5">Вопрос <span id="qNum">1</span>/10</span>
                <span id="scoreDisplay" class="fs-5">Счёт: 0</span>
            </div>
            <h4 id="question" class="mb-4"></h4>
            <div id="options" class="d-grid gap-3"></div>
        </div>
        <div id="testResult" class="mt-5 text-center" style="display:none;"></div>
    </div>
</main>

<footer>
    <p>© 2026 Индивидуальный проект Бердяева Владислава (группа ОИБ-125)</p>
</footer>

<script>
    let currentQuestion = 0;
    let score = 0;
    const questions = [
        { q: "Что такое информационный след пользователя?", a: ["Данные, которые вы оставляете в интернете", "Только ваши пароли", "Только IP-адрес", "Только история браузера"], correct: 0 },
        { q: "Какой след считается пассивным?", a: ["Посты и комментарии", "Данные, которые собирают без вашего участия", "Фото и видео", "Регистрации на сайтах"], correct: 1 },
        { q: "Что такое browser fingerprint?", a: ["Отпечаток браузера", "Тип браузера", "История поиска", "Пароль"], correct: 0 },
        { q: "Какой инструмент лучше всего скрывает IP-адрес?", a: ["2FA", "VPN", "Очистка cookies", "Менеджер паролей"], correct: 1 },
        { q: "Что такое doxing?", a: ["Публикация личных данных человека", "Шифрование трафика", "Проверка утечек", "Создание сложных паролей"], correct: 0 },
        { q: "Какой поисковик не собирает ваши данные?", a: ["Google", "Яндекс", "DuckDuckGo", "Mail.ru"], correct: 2 },
        { q: "Что делает двухфакторная аутентификация (2FA)?", a: ["Шифрует данные", "Добавляет второй этап подтверждения входа", "Очищает cookies", "Скрывает IP"], correct: 1 },
        { q: "Что такое deepfake?", a: ["Поддельное видео или аудио, созданное с помощью ИИ", "Вид цифрового следа", "Тип атаки", "Приватный браузер"], correct: 0 },
        { q: "Какой метод называется «загрязнением данных»?", a: ["Размещение ложной или противоречивой информации о себе", "Очистка истории", "Использование VPN", "Включение 2FA"], correct: 0 },
        { q: "Что рекомендуется делать регулярно для защиты цифрового следа?", a: ["Публиковать больше фото", "Проводить аудит своего цифрового следа", "Отключать 2FA", "Использовать один пароль везде"], correct: 1 }
    ];

    function loadQuestion() {
        const q = questions[currentQuestion];
        document.getElementById('qNum').textContent = currentQuestion + 1;
        document.getElementById('question').textContent = q.q;
        document.getElementById('scoreDisplay').textContent = `Счёт: ${score}`;
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';
        q.a.forEach((answer, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-outline-primary w-100 text-start py-3';
            btn.textContent = answer;
            btn.onclick = () => checkAnswer(index);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(selected) {
        if (selected === questions[currentQuestion].correct) score++;
        currentQuestion++;
        if (currentQuestion < questions.length) loadQuestion();
        else showResult();
    }

    function showResult() {
        const percent = Math.round((score / questions.length) * 100);
        let message = percent >= 80 ? "Отлично! Вы хорошо знаете тему." : (percent >= 60 ? "Хороший результат, но можно лучше." : "Рекомендуем ещё раз изучить материал.");
        document.getElementById('testResult').innerHTML = `<h3 class="mb-4">Тест завершён!</h3><h2>Ваш результат: ${score} из ${questions.length} (${percent}%)</h2><p class="lead">${message}</p><button onclick="restartTest()" class="btn btn-primary mt-4">Пройти тест заново</button>`;
        document.getElementById('testResult').style.display = 'block';
    }

    function restartTest() { currentQuestion = 0; score = 0; document.getElementById('testResult').style.display = 'none'; loadQuestion(); }
    window.onload = loadQuestion;
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
